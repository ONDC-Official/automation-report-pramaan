version: '3.8'

services:
  buyer-pramaan-dev:
    build: 
      context: ./buyerNPTestAPI
      dockerfile: ../Dockerfile.js
      args:
        - NODE_ENV=${NODE_ENV}
        - ENV_FILE=${ENV_FILE} 
    container_name: buyer-pramaan-dev
    ports:
      - "5063:3005"
    environment:
      - NODE_ENV=${NODE_ENV}
    networks:
      - beta-nginx-network
    restart: always

  seller-pramaan-dev:
    build: 
      context: ./sellerNPTestAPI
      dockerfile: ../Dockerfile.js
      args:
        - NODE_ENV=${NODE_ENV}
        - ENV_FILE=${ENV_FILE} 
    container_name: seller-pramaan-dev
    ports:
      - "5055:3005"
    environment:
      - NODE_ENV=${NODE_ENV}
    networks:
      - beta-nginx-network
    restart: always

  mongo:
    image: mongo:6.0
    container_name: mongo-pramaan-dev
    restart: always
    ports:
      - "27019:27017"   # remove if you don't want host access
    volumes:
      - mongo-data:/data/db
    networks:
      - beta-nginx-network
networks:
  beta-nginx-network:
    external: false
    
volumes:
  mongo-data: