name: Build and Deploy to EKS

on:
  push:
    branches:
      - "draft-*"
      - "release-*"

permissions:
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set repository name to lowercase
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ONDC-Official

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── draft-* : bump version.txt, build fresh image ─────────────────────
      - name: Read semver from package.json and compute image tags
        run: |
          # Read semver from a package.json (developers should bump this manually)
          SEMVER=$(node -p "require('./buyerNPTestAPI/package.json').version")
          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          # Tag prefix: main -> prod, non-main -> dev
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            PREFIX=prod
          else
            PREFIX=dev
          fi

          IMAGE_TAG="${PREFIX}-${SEMVER}-${SHORT_SHA}"

          # Preserve existing environment/target-file logic for draft/release branches
          if [[ "${GITHUB_REF_NAME}" == draft-* ]]; then
            ENVIRONMENT=draft
            TARGET_FILE=k8/aws/helm/service-layer/values.yaml
          else
            ENVIRONMENT=prod
            TARGET_FILE=k8/aws/helm/service-layer/values-preprod.yaml
          fi

          BUYER_IMAGE="ghcr.io/${REPO_LOWER}-buyer"
          SELLER_IMAGE="ghcr.io/${REPO_LOWER}-seller"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            BUYER_TAGS="${BUYER_IMAGE}:${IMAGE_TAG},${BUYER_IMAGE}:latest"
            SELLER_TAGS="${SELLER_IMAGE}:${IMAGE_TAG},${SELLER_IMAGE}:latest"
          else
            BUYER_TAGS="${BUYER_IMAGE}:${IMAGE_TAG}"
            SELLER_TAGS="${SELLER_IMAGE}:${IMAGE_TAG}"
          fi

          echo "SEMVER=$SEMVER" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
          echo "TARGET_FILE=$TARGET_FILE" >> $GITHUB_ENV
          echo "BUYER_IMAGE=$BUYER_IMAGE" >> $GITHUB_ENV
          echo "SELLER_IMAGE=$SELLER_IMAGE" >> $GITHUB_ENV
          echo "BUYER_IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "SELLER_IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "BUYER_TAGS=$BUYER_TAGS" >> $GITHUB_ENV
          echo "SELLER_TAGS=$SELLER_TAGS" >> $GITHUB_ENV

      # ── BUILD — draft-* only ───────────────────────────────────────────────
      - name: Generate OCI labels (metadata)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.BUYER_IMAGE }}
            ${{ env.SELLER_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.SEMVER }}

      - name: Build and push buyer image
        if: startsWith(github.ref_name, 'draft-')
        uses: docker/build-push-action@v5
        with:
          context: ./buyerNPTestAPI
          file: ./Dockerfile.js
          push: true
          tags: ${{ env.BUYER_TAGS }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push seller image
        if: startsWith(github.ref_name, 'draft-')
        uses: docker/build-push-action@v5
        with:
          context: ./sellerNPTestAPI
          file: ./Dockerfile.js
          push: true
          tags: ${{ env.SELLER_TAGS }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── PROMOTE — release-* only (retag draft image, no rebuild) ──────────
      - name: Promote buyer image draft → prod
        if: startsWith(github.ref_name, 'release-')
        run: |
          DRAFT_TAG="ghcr.io/$REPO_LOWER-buyer:draft-$VERSION"
          PROD_TAG="ghcr.io/$REPO_LOWER-buyer:prod-$VERSION"
          docker pull $DRAFT_TAG
          docker tag  $DRAFT_TAG $PROD_TAG
          docker push $PROD_TAG
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker tag $DRAFT_TAG ghcr.io/$REPO_LOWER-buyer:latest
            docker push ghcr.io/$REPO_LOWER-buyer:latest
          fi

      - name: Promote seller image draft → prod
        if: startsWith(github.ref_name, 'release-')
        run: |
          DRAFT_TAG="ghcr.io/$REPO_LOWER-seller:draft-$VERSION"
          PROD_TAG="ghcr.io/$REPO_LOWER-seller:prod-$VERSION"
          docker pull $DRAFT_TAG
          docker tag  $DRAFT_TAG $PROD_TAG
          docker push $PROD_TAG
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker tag $DRAFT_TAG ghcr.io/$REPO_LOWER-seller:latest
            docker push ghcr.io/$REPO_LOWER-seller:latest
          fi

      # ── UPDATE IaC (both envs — different TARGET_FILE) ────────────────────
      - name: Clone automation-iac repo
        uses: actions/checkout@v4
        with:
          repository: ONDC-Official/automation-iac
          token: ${{ steps.app-token.outputs.token }}
          path: automation-iac

      - name: Update image tags in Helm values file
        run: |
          python3 << 'PYEOF'
          import re, os

          target     = f"automation-iac/{os.environ['TARGET_FILE']}"
          buyer_tag  = os.environ['BUYER_IMAGE_TAG']
          seller_tag = os.environ['SELLER_IMAGE_TAG']
          buyer_repo = os.environ['BUYER_IMAGE_REPO']
          seller_repo = os.environ['SELLER_IMAGE_REPO']

          with open(target, 'r') as f:
              lines = f.readlines()

          current_section = None
          result = []
          for line in lines:
              if re.match(r'^[a-zA-Z]', line):
                  stripped = line.strip()
                  if stripped.startswith('reportPramaanBuyer:'):
                      current_section = 'buyer'
                  elif stripped.startswith('reportPramaanSeller:'):
                      current_section = 'seller'
                  else:
                      current_section = None
              if current_section == 'buyer':
                  if re.match(r'^\s+tag:\s', line):
                      line = re.sub(r'(tag:\s).*', rf'\g<1>{buyer_tag}', line)
                  elif re.match(r'^\s+repository:\s', line):
                      line = re.sub(r'(repository:\s).*', rf'\g<1>{buyer_repo}', line)
              elif current_section == 'seller':
                  if re.match(r'^\s+tag:\s', line):
                      line = re.sub(r'(tag:\s).*', rf'\g<1>{seller_tag}', line)
                  elif re.match(r'^\s+repository:\s', line):
                      line = re.sub(r'(repository:\s).*', rf'\g<1>{seller_repo}', line)
              result.append(line)

          with open(target, 'w') as f:
              f.writelines(result)
          PYEOF
        env:
          TARGET_FILE:      ${{ env.TARGET_FILE }}
          BUYER_IMAGE_TAG:  ${{ env.BUYER_IMAGE_TAG }}
          SELLER_IMAGE_TAG: ${{ env.SELLER_IMAGE_TAG }}
          BUYER_IMAGE_REPO:  ghcr.io/${{ env.REPO_LOWER }}-buyer
          SELLER_IMAGE_REPO: ghcr.io/${{ env.REPO_LOWER }}-seller

      - name: Commit and push tag update to IaC repo
        run: |
          cd automation-iac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.TARGET_FILE }}"
          git commit -m "ci: promote pramaan to ${{ env.ENVIRONMENT }} — buyer=${{ env.BUYER_IMAGE_TAG }}, seller=${{ env.SELLER_IMAGE_TAG }}"
          git push
