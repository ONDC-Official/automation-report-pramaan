name: Build and Deploy to EKS

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set repository name to lowercase
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Generate GitHub  App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ONDC-Official

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ steps.app-token.outputs.token }}

      - name: Auto-increment patch version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          current_version=$(cat version.txt)
          echo "CURRENT_VERSION=$current_version" >> $GITHUB_ENV
          IFS='.' read -r -a version_parts <<< "$current_version"
          major="${version_parts[0]}"
          minor="${version_parts[1]}"
          patch="${version_parts[2]}"
          patch=$((patch + 1))
          next_version="$major.$minor.$patch"
          echo "Next version: $next_version"
          echo "$next_version" > version.txt
          echo "VERSION=$next_version" >> $GITHUB_ENV
          git add version.txt
          git commit -m "ci: auto-increment version to $next_version [skip ci]"
          git push

      - name: Determine environment and image tags
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "BUYER_IMAGE_TAG=prod-${{ env.VERSION }}" >> $GITHUB_ENV
            echo "SELLER_IMAGE_TAG=prod-${{ env.VERSION }}" >> $GITHUB_ENV
            echo "TARGET_FILE=k8/aws/helm/service-layer/values-prod.yaml" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "BUYER_IMAGE_TAG=dev-${{ env.VERSION }}" >> $GITHUB_ENV
            echo "SELLER_IMAGE_TAG=dev-${{ env.VERSION }}" >> $GITHUB_ENV
            echo "TARGET_FILE=k8/aws/helm/service-layer/values.yaml" >> $GITHUB_ENV
          fi
        env:
          VERSION: ${{ env.VERSION }}

      - name: Build and push buyer image
        uses: docker/build-push-action@v5
        with:
          context: ./buyerNPTestAPI
          file: ./Dockerfile.js
          push: true
          tags: |
            ghcr.io/ondc-official/workbench-report-pramaan-buyer:${{ env.BUYER_IMAGE_TAG }}
            ghcr.io/ondc-official/workbench-report-pramaan-buyer:latest

      - name: Build and push seller image
        uses: docker/build-push-action@v5
        with:
          context: ./sellerNPTestAPI
          file: ./Dockerfile.js
          push: true
          tags: |
            ghcr.io/ondc-official/workbench-report-pramaan-seller:${{ env.SELLER_IMAGE_TAG }}
            ghcr.io/ondc-official/workbench-report-pramaan-seller:latest

      - name: Clone automation-iac repo
        uses: actions/checkout@v4
        with:
          repository: ONDC-Official/automation-iac
          token: ${{ steps.app-token.outputs.token }}
          path: automation-iac

      - name: Update image tags in Helm values file
        run: |
          python3 << 'PYEOF'
          import re, os

          target = f"automation-iac/{os.environ['TARGET_FILE']}"
          buyer_tag = os.environ['BUYER_IMAGE_TAG']
          seller_tag = os.environ['SELLER_IMAGE_TAG']

          with open(target, 'r') as f:
              lines = f.readlines()

          current_section = None
          result = []
          for line in lines:
              # Top-level keys (no leading whitespace) mark section boundaries
              if re.match(r'^[a-zA-Z]', line):
                  stripped = line.strip()
                  if stripped.startswith('reportPramaanBuyer:'):
                      current_section = 'buyer'
                  elif stripped.startswith('reportPramaanSeller:'):
                      current_section = 'seller'
                  else:
                      current_section = None
              if current_section == 'buyer' and re.match(r'^\s+tag:\s', line):
                  line = re.sub(r'(tag:\s).*', rf'\g<1>{buyer_tag}', line)
              elif current_section == 'seller' and re.match(r'^\s+tag:\s', line):
                  line = re.sub(r'(tag:\s).*', rf'\g<1>{seller_tag}', line)
              result.append(line)

          with open(target, 'w') as f:
              f.writelines(result)
          PYEOF
        env:
          TARGET_FILE: ${{ env.TARGET_FILE }}
          BUYER_IMAGE_TAG: ${{ env.BUYER_IMAGE_TAG }}
          SELLER_IMAGE_TAG: ${{ env.SELLER_IMAGE_TAG }}

      - name: Commit and push tag update to IaC repo
        run: |
          cd automation-iac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.TARGET_FILE }}"
          git commit -m "ci: update pramaan image tags to buyer=${{ env.BUYER_IMAGE_TAG }}, seller=${{ env.SELLER_IMAGE_TAG }} (${{ env.ENVIRONMENT }})"
          git push
