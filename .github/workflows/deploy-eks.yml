name: Build and Deploy to EKS

on:
  push:
    branches:
      - "draft-*"
      - "release-*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set repository name to lowercase
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ONDC-Official

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── draft-* : bump version.txt, build fresh image ─────────────────────
      - name: Bump version and set VERSION (draft only)
        if: startsWith(github.ref_name, 'draft-')
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          current_version=$(cat version.txt)
          IFS='.' read -r -a version_parts <<< "$current_version"
          major="${version_parts[0]}"
          minor="${version_parts[1]}"
          patch="${version_parts[2]}"
          patch=$((patch + 1))
          next_version="$major.$minor.$patch"
          echo "$next_version" > version.txt
          echo "VERSION=$next_version" >> $GITHUB_ENV
          git add version.txt
          git commit -m "ci: auto-increment version to $next_version [skip ci]"
          git push
          echo "Next version: $next_version"

      # ── release-* : read version.txt from branch (no bump) ────────────────
      - name: Read version from version.txt (release only)
        if: startsWith(github.ref_name, 'release-')
        run: |
          VERSION=$(cat version.txt)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Promoting version: $VERSION"

      # ── Set environment-specific values using shell $VERSION ───────────────
      - name: Set environment and image tags
        run: |
          if [[ "${{ github.ref_name }}" == draft-* ]]; then
            echo "ENVIRONMENT=draft"                                  >> $GITHUB_ENV
            echo "BUYER_IMAGE_TAG=draft-${VERSION}"                  >> $GITHUB_ENV
            echo "SELLER_IMAGE_TAG=draft-${VERSION}"                 >> $GITHUB_ENV
            echo "TARGET_FILE=k8/aws/helm/service-layer/values.yaml" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=prod"                                        >> $GITHUB_ENV
            echo "BUYER_IMAGE_TAG=prod-${VERSION}"                        >> $GITHUB_ENV
            echo "SELLER_IMAGE_TAG=prod-${VERSION}"                       >> $GITHUB_ENV
            echo "TARGET_FILE=k8/aws/helm/service-layer/values-preprod.yaml" >> $GITHUB_ENV
          fi

      # ── BUILD — draft-* only ───────────────────────────────────────────────
      - name: Build and push buyer image
        if: startsWith(github.ref_name, 'draft-')
        uses: docker/build-push-action@v5
        with:
          context: ./buyerNPTestAPI
          file: ./Dockerfile.js
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}-buyer:${{ env.BUYER_IMAGE_TAG }}

      - name: Build and push seller image
        if: startsWith(github.ref_name, 'draft-')
        uses: docker/build-push-action@v5
        with:
          context: ./sellerNPTestAPI
          file: ./Dockerfile.js
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}-seller:${{ env.SELLER_IMAGE_TAG }}

      # ── PROMOTE — release-* only (retag draft image, no rebuild) ──────────
      - name: Promote buyer image draft → prod
        if: startsWith(github.ref_name, 'release-')
        run: |
          DRAFT_TAG="ghcr.io/$REPO_LOWER-buyer:draft-$VERSION"
          PROD_TAG="ghcr.io/$REPO_LOWER-buyer:prod-$VERSION"
          docker pull $DRAFT_TAG
          docker tag  $DRAFT_TAG $PROD_TAG
          docker tag  $DRAFT_TAG ghcr.io/$REPO_LOWER-buyer:latest
          docker push $PROD_TAG
          docker push ghcr.io/$REPO_LOWER-buyer:latest

      - name: Promote seller image draft → prod
        if: startsWith(github.ref_name, 'release-')
        run: |
          DRAFT_TAG="ghcr.io/$REPO_LOWER-seller:draft-$VERSION"
          PROD_TAG="ghcr.io/$REPO_LOWER-seller:prod-$VERSION"
          docker pull $DRAFT_TAG
          docker tag  $DRAFT_TAG $PROD_TAG
          docker tag  $DRAFT_TAG ghcr.io/$REPO_LOWER-seller:latest
          docker push $PROD_TAG
          docker push ghcr.io/$REPO_LOWER-seller:latest

      # ── UPDATE IaC (both envs — different TARGET_FILE) ────────────────────
      - name: Clone automation-iac repo
        uses: actions/checkout@v4
        with:
          repository: ONDC-Official/automation-iac
          token: ${{ steps.app-token.outputs.token }}
          path: automation-iac

      - name: Update image tags in Helm values file
        run: |
          python3 << 'PYEOF'
          import re, os

          target     = f"automation-iac/{os.environ['TARGET_FILE']}"
          buyer_tag  = os.environ['BUYER_IMAGE_TAG']
          seller_tag = os.environ['SELLER_IMAGE_TAG']
          buyer_repo = os.environ['BUYER_IMAGE_REPO']
          seller_repo = os.environ['SELLER_IMAGE_REPO']

          with open(target, 'r') as f:
              lines = f.readlines()

          current_section = None
          result = []
          for line in lines:
              if re.match(r'^[a-zA-Z]', line):
                  stripped = line.strip()
                  if stripped.startswith('reportPramaanBuyer:'):
                      current_section = 'buyer'
                  elif stripped.startswith('reportPramaanSeller:'):
                      current_section = 'seller'
                  else:
                      current_section = None
              if current_section == 'buyer':
                  if re.match(r'^\s+tag:\s', line):
                      line = re.sub(r'(tag:\s).*', rf'\g<1>{buyer_tag}', line)
                  elif re.match(r'^\s+repository:\s', line):
                      line = re.sub(r'(repository:\s).*', rf'\g<1>{buyer_repo}', line)
              elif current_section == 'seller':
                  if re.match(r'^\s+tag:\s', line):
                      line = re.sub(r'(tag:\s).*', rf'\g<1>{seller_tag}', line)
                  elif re.match(r'^\s+repository:\s', line):
                      line = re.sub(r'(repository:\s).*', rf'\g<1>{seller_repo}', line)
              result.append(line)

          with open(target, 'w') as f:
              f.writelines(result)
          PYEOF
        env:
          TARGET_FILE:      ${{ env.TARGET_FILE }}
          BUYER_IMAGE_TAG:  ${{ env.BUYER_IMAGE_TAG }}
          SELLER_IMAGE_TAG: ${{ env.SELLER_IMAGE_TAG }}
          BUYER_IMAGE_REPO:  ghcr.io/${{ env.REPO_LOWER }}-buyer
          SELLER_IMAGE_REPO: ghcr.io/${{ env.REPO_LOWER }}-seller

      - name: Commit and push tag update to IaC repo
        run: |
          cd automation-iac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.TARGET_FILE }}"
          git commit -m "ci: promote pramaan to ${{ env.ENVIRONMENT }} — buyer=${{ env.BUYER_IMAGE_TAG }}, seller=${{ env.SELLER_IMAGE_TAG }}"
          git push
