name: Build and Deploy to EKS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - draft-*
      - release-staging
      - release-*

permissions:
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Read semver, compute image tag and target file
  # ──────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      image_tag:   ${{ steps.set.outputs.image_tag }}
      environment: ${{ steps.set.outputs.environment }}
      target_file: ${{ steps.set.outputs.target_file }}
      version:     ${{ steps.set.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and build image tag
        id: set
        run: |
          VERSION=$(node -p "require('./buyerNPTestAPI/package.json').version")
          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          if [[ "${{ github.ref_name }}" == release-* ]]; then
            ENV=staging
            TARGET="k8/aws/helm/service-layer/values-staging.yaml"
          else
            ENV=dev
            TARGET="k8/aws/helm/service-layer/values.yaml"
          fi

          IMAGE_TAG="${ENV}-${VERSION}-${SHORT_SHA}"

          echo "version=${VERSION}"       >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}"   >> $GITHUB_OUTPUT
          echo "environment=${ENV}"       >> $GITHUB_OUTPUT
          echo "target_file=${TARGET}"    >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────
  # Job 2a: Build & push buyer image (parallel)
  # ──────────────────────────────────────────────
  build-buyer:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set buyer image metadata
        id: meta-buyer
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ondc-official/automation-report-pramaan-buyer
          tags: ${{ needs.version.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push buyer image
        uses: docker/build-push-action@v5
        with:
          context: ./buyerNPTestAPI
          file: ./Dockerfile.js
          push: true
          tags: ${{ steps.meta-buyer.outputs.tags }}
          labels: ${{ steps.meta-buyer.outputs.labels }}
          cache-from: type=gha,scope=buyer
          cache-to: type=gha,mode=max,scope=buyer

  # ──────────────────────────────────────────────
  # Job 2b: Build & push seller image (parallel)
  # ──────────────────────────────────────────────
  build-seller:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set seller image metadata
        id: meta-seller
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ondc-official/automation-report-pramaan-seller
          tags: ${{ needs.version.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push seller image
        uses: docker/build-push-action@v5
        with:
          context: ./sellerNPTestAPI
          file: ./Dockerfile.js
          push: true
          tags: ${{ steps.meta-seller.outputs.tags }}
          labels: ${{ steps.meta-seller.outputs.labels }}
          cache-from: type=gha,scope=seller
          cache-to: type=gha,mode=max,scope=seller

  # ──────────────────────────────────────────────
  # Job 3: Update image tags in IaC Helm values
  # ──────────────────────────────────────────────
  update-iac:
    needs: [version, build-buyer, build-seller]
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: automation-iac

      - name: Clone automation-iac repo
        uses: actions/checkout@v4
        with:
          repository: ONDC-Official/automation-iac
          token: ${{ steps.app-token.outputs.token }}
          path: automation-iac

      - name: Update buyer and seller image tags in Helm values file
        run: |
          python3 << 'PYEOF'
          import re, os

          target = f"automation-iac/{os.environ['TARGET_FILE']}"
          image_tag = os.environ['IMAGE_TAG']

          with open(target, 'r') as f:
              lines = f.readlines()

          current_section = None
          result = []
          for line in lines:
              if re.match(r'^[a-zA-Z]', line):
                  current_section = line.strip().rstrip(':').split(':')[0]
              if current_section in ('reportPramaanBuyer', 'reportPramaanSeller') and re.match(r'^\s+tag:\s', line):
                  line = re.sub(r'(tag:\s*).*', rf'\g<1>{image_tag}', line)
              result.append(line)

          with open(target, 'w') as f:
              f.writelines(result)

          print(f"Updated reportPramaanBuyer and reportPramaanSeller image tags to: {image_tag}")
          PYEOF
        env:
          TARGET_FILE: ${{ needs.version.outputs.target_file }}
          IMAGE_TAG:   ${{ needs.version.outputs.image_tag }}

      - name: Commit and push tag update to IaC repo
        run: |
          cd automation-iac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ needs.version.outputs.target_file }}"
          if git diff --staged --quiet; then
            echo "Image tag already up to date, skipping commit."
          else
            git commit -m "ci: update automation-report-pramaan image tags to ${{ needs.version.outputs.image_tag }} (${{ needs.version.outputs.environment }})"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep $((i * 5))
            done
          fi
